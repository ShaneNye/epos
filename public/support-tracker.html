<!doctype html><html lang="en"><head><script src="/js/browserLogFilter.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/moon-man-logo.ico"><title>Log Support</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/support-tracker.css"><script src="/js/storage.js"></script><script src="/js/menu.js"></script><script defer src="/js/support-tracker-log.js"></script></head>
<link rel="stylesheet" href="/css/support-tracker-responsive.css"><body class="support-logger-body"><div id="menu"></div><main class="content support-page logger-page">
 <header class="logger-header"><div><span class="eyebrow">On-demand support</span><h1>Log Support</h1></div><a class="secondary-link" href="/support-tracker/manage">Analytics &amp; configuration</a></header>
 <section class="timer-card logger-timer"><span id="timerDisplay">00:00:00</span><button id="timerButton" class="primary" type="button">Start Support</button></section><p id="status" class="status" role="status"></p>
 <form id="supportForm" class="panel compact-form"><div class="form-grid logger-grid">
  <label>User<div class="search-select" data-field="userId"><input id="userSearch" type="search" autocomplete="off" placeholder="Type 3 characters…"><input id="userId" type="hidden"><div class="search-results"></div></div></label><label>Location<div class="search-select" data-field="locationId"><input id="locationSearch" type="search" autocomplete="off" placeholder="Type 3 characters…"><input id="locationId" type="hidden"><div class="search-results"></div></div></label><label>System<select id="systemId" required><option value="">Select system…</option></select></label><label>Category<select id="categoryId" required disabled><option value="">Select a system first</option></select></label><label class="span-two">Issue<div class="search-select" data-field="issueId"><input id="issueSearch" type="search" autocomplete="off" placeholder="Select a category first"><input id="issueId" type="hidden"><div class="search-results"></div></div></label>
  <fieldset class="error-toggle span-two"><legend>Error Type</legend><label><input type="radio" name="errorType" value="user" required>User Error</label><label><input type="radio" name="errorType" value="system">System Error</label><label><input type="radio" name="errorType" value="other">Other</label></fieldset>
  <label>Resolution<div class="search-select" data-field="resolutionId"><input id="resolutionSearch" type="search" autocomplete="off" placeholder="Type 3 characters…"><input id="resolutionId" type="hidden"><div class="search-results"></div></div></label><label>Cause<div class="search-select" data-field="causeId"><input id="causeSearch" type="search" autocomplete="off" placeholder="Type 3 characters…"><input id="causeId" type="hidden"><div class="search-results"></div></div></label><label class="span-two">Reference number<input id="referenceNumber" autocomplete="off" inputmode="text"></label><label class="span-two">Short description / notes<textarea id="description" rows="2"></textarea></label><label class="span-two">Resolution notes<textarea id="resolutionNotes" rows="2"></textarea></label>
  <details class="span-two correction"><summary>Correct start/end time</summary><div><label>Start<input id="startAt" type="datetime-local"></label><label>End<input id="endAt" type="datetime-local"></label></div></details>
 </div><div class="form-actions logger-actions"><button class="primary save-support" type="submit">Save support request</button><span id="timerHint">Start and stop the timer before saving.</span></div></form>
</main></body></html>
