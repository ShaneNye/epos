<!doctype html><html lang="en"><head><script src="/js/browserLogFilter.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/moon-man-logo.ico"><title>Support Analytics</title><link rel="stylesheet" href="/css/home.css"><link rel="stylesheet" href="/css/support-tracker.css"><script src="/js/storage.js"></script><script src="/js/menu.js"></script><script defer src="/js/support-tracker-manage.js"></script></head>
<link rel="stylesheet" href="/css/support-tracker-responsive.css"><body><div id="menu"></div><main class="content support-page"><header class="manage-header"><div><span class="eyebrow">Support Tracker</span><h1>Analytics &amp; Configuration</h1></div><a class="primary link-button" href="/support-tracker">Open logger</a></header><nav class="tabs"><button class="tab active" data-tab="analytics">Analytics</button><button class="tab" data-tab="history">History</button><button class="tab" data-tab="configuration" id="configTab">Configuration</button></nav><p id="status" class="status" role="status"></p>
 <section id="analyticsPanel" class="tab-panel active"><div class="panel filters"><label>Period<select id="period"><option value="today">Today</option><option value="week">This Week</option><option value="month" selected>This Month</option><option value="lastMonth">Last Month</option><option value="30">Last 30 Days</option><option value="quarter">This Quarter</option><option value="custom">Custom</option></select></label><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><button id="refreshAnalytics" class="primary">Apply</button></div><div id="kpis" class="kpi-grid"></div><div class="analytics-grid"><section class="panel"><h2>Request trend</h2><div id="trendChart" class="bars"></div></section><section class="panel"><h2>Breakdowns</h2><div id="breakdowns"></div></section></div><section class="panel"><span class="eyebrow">Deterministic analysis</span><h2>Insights</h2><div id="insights" class="insights"></div></section></section>
 <section id="historyPanel" class="tab-panel"><section class="panel history"><div class="panel-title"><h2>Support history</h2><input id="historySearch" type="search" placeholder="Search records…"></div><div class="table-scroll"><table><thead><tr><th>Date</th><th>User</th><th>Location</th><th>System</th><th>Category</th><th>Issue</th><th>Error</th><th>Duration</th><th>Resolution</th><th>Cause</th></tr></thead><tbody id="historyBody"></tbody></table></div><div class="pager"><button id="prevPage">Previous</button><span id="pageInfo"></span><button id="nextPage">Next</button></div></section></section>
 <section id="configurationPanel" class="tab-panel"><section class="panel"><h2>Configuration</h2><p>Inactive values remain attached to historical records.</p><div id="configLists" class="config-grid"></div></section></section>
</main></body></html>
